[project]
name = "image-similarity-measures"
version = "0.4.0"
description = "Evaluation metrics to assess the similarity between two images."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "UP42", email = "support@up42.com" }]
requires-python = ">=3.10,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Development Status :: 5 - Production/Stable",
]
dependencies = [
    "numpy>=1.24.2,<3",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "opencv-python>=4.10",
    "phasepack>=1.5",
]

[project.optional-dependencies]
rasterio = ["rasterio>=1.3"]
speedups = ["pyfftw>=0.13"]

[project.scripts]
image-similarity-measures = "image_similarity_measures.evaluate:main"

[dependency-groups]
test = ["pytest>=7.3", "rasterio>=1.3"]

[build-system]
requires = ["uv_build>=0.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "image_similarity_measures"
module-root = ""
