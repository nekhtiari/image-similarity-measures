[project]
name = "image-similarity-measures"
version = "0.4.0"
description = "Evaluation metrics to assess the similarity between two images."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nikoo Ekhtiari" }]
maintainers = [{ name = "Nikoo Ekhtiari" }]
requires-python = ">=3.10"
keywords = [
    "image quality",
    "image similarity",
    "remote sensing",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Development Status :: 5 - Production/Stable",
]
dependencies = [
    "numpy>=1.24.2,<3",
    "scipy>=1.13,<2",
    "scikit-image>=0.24,<1",
    "opencv-python>=4.10,<6",
    "phasepack>=1.5,<2",
]

[project.urls]
Changelog = "https://github.com/nekhtiari/image-similarity-measures/blob/master/CHANGELOG.md"
Issues = "https://github.com/nekhtiari/image-similarity-measures/issues"
Repository = "https://github.com/nekhtiari/image-similarity-measures"

[project.optional-dependencies]
rasterio = ["rasterio>=1.4,<2"]
speedups = ["pyfftw>=0.14,<1"]

[project.scripts]
image-similarity-measures = "image_similarity_measures.evaluate:main"

[dependency-groups]
test = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "rasterio>=1.4,<2",
]
lint = ["ruff>=0.13,<0.15"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    "build>=1.2,<2",
    "check-wheel-contents>=0.6,<1",
    "pip-audit>=2.9,<3",
    "twine>=6,<7",
]

[build-system]
requires = ["uv_build>=0.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "image_similarity_measures"
module-root = ""

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=image_similarity_measures",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::UserWarning:phasepack.tools",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PIE", "RUF", "UP"]
ignore = ["E501"] # Ruff's formatter intentionally leaves long comments and strings.

[tool.ruff.lint.per-file-ignores]
"image_similarity_measures/evaluate.py" = [
    "UP006", # Preserve the 0.3.6 runtime signature in the compatibility release.
    "UP035",
]
