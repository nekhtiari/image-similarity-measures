name: Python
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        extras:
          - ''
          - '--extra speedups'
          - '--extra speedups --extra rasterio'
    steps:
      - uses: actions/checkout@v4
      - name: Install fftw (for pyfftw)
        if: contains(matrix.extras, 'speedups')
        run: sudo apt-get install -y fftw3-dev
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync deps
        run: uv sync --group test ${{ matrix.extras }}
      - name: Run pytest
        run: uv run pytest
      - name: Smoke-test CLI (all metrics)
        run: uv run image-similarity-measures --metric all --org_img_path=example/lafayette_org.tif --pred_img_path=example/lafayette_pred.tif
